[project]
name = "bff-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "bcrypt>=4.2",
  "pyjwt[crypto]>=2.9",
  "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
