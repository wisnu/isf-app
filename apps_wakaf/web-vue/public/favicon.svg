<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#166534"/>
  <!-- Tree foliage (cluster of leafy circles, light green) -->
  <g fill="#a3e635">
    <circle cx="10" cy="9" r="2.4"/>
    <circle cx="13" cy="6.5" r="2.4"/>
    <circle cx="16" cy="5.5" r="2.4"/>
    <circle cx="19" cy="6.5" r="2.4"/>
    <circle cx="22" cy="9" r="2.4"/>
    <circle cx="13" cy="9.5" r="2.2"/>
    <circle cx="19" cy="9.5" r="2.2"/>
    <circle cx="16" cy="9.5" r="2"/>
  </g>
  <!-- Crescent (peeking through foliage) -->
  <path d="M13.5 2.8 a 1.5 1.5 0 1 0 0 2.9 a 1.05 1.05 0 1 1 0 -2.9 z" fill="#fff"/>
  <!-- Star -->
  <path d="M18.3 2.4 L 18.55 3.1 L 19.3 3.1 L 18.7 3.55 L 18.9 4.25 L 18.3 3.85 L 17.7 4.25 L 17.9 3.55 L 17.3 3.1 L 18.05 3.1 Z" fill="#fff"/>
  <!-- Tree trunk -->
  <rect x="15.1" y="11" width="1.8" height="6.5" fill="#a3e635"/>
  <!-- Mosque dome -->
  <path d="M11 17 Q 16 12 21 17 Z" fill="#fff"/>
  <!-- Mosque small finial on dome -->
  <line x1="16" y1="12" x2="16" y2="10.5" stroke="#fff" stroke-width="0.7"/>
  <!-- Mosque body -->
  <rect x="11" y="17" width="10" height="5" fill="#fff"/>
  <!-- Mosque arched entrance -->
  <path d="M14 22 L 14 19.5 Q 16 18 18 19.5 L 18 22 Z" fill="#166534"/>
  <!-- Roots spreading below -->
  <g stroke="#fff" stroke-width="0.9" fill="none" stroke-linecap="round">
    <path d="M12.5 22 Q 10.5 24 9 25.5"/>
    <path d="M12.5 22 Q 11.5 25 13 27.5"/>
    <path d="M16 22 L 16 28"/>
    <path d="M19.5 22 Q 21.5 24 23 25.5"/>
    <path d="M19.5 22 Q 20.5 25 19 27.5"/>
  </g>
</svg>
